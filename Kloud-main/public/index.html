<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kloud</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* User menu styles */
    .user-menu {
      position: fixed;
      top: 20px;
      right: 80px;
      z-index: 100;
    }
    
    .user-menu-toggle {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .user-menu-toggle:hover {
      background-color: var(--primary-hover);
    }
    
    .user-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 10px;
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      min-width: 200px;
      display: none;
      z-index: 101;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }
    
    .user-dropdown.show {
      display: block;
      animation: fadeIn 0.2s ease-in-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .user-info {
      padding: 15px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }
    
    .user-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: var(--primary-color);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin: 0 auto 10px;
    }
    
    .user-name {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 5px;
    }
    
    .user-role {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    
    .dropdown-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    .dropdown-item {
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-primary);
      text-decoration: none;
      transition: background-color 0.2s;
      cursor: pointer;
    }
    
    .dropdown-item:hover {
      background-color: var(--border-color);
    }
    
    .dropdown-item i {
      width: 20px;
      text-align: center;
    }
    
    .dropdown-item.logout {
      color: var(--danger-color);
    }
  </style>
</head>
<body>
  <div class="theme-switch-wrapper">
    <span class="theme-icon"><i class="fas fa-moon"></i></span>
    <label class="theme-switch">
      <input type="checkbox" id="theme-toggle">
      <span class="slider"></span>
    </label>
  </div>
  
  <!-- User menu -->
  <div class="user-menu">
    <button class="user-menu-toggle" id="user-menu-toggle">
      <i class="fas fa-user"></i>
    </button>
    <div class="user-dropdown" id="user-dropdown">
      <div class="user-info">
        <div class="user-avatar">
          <i class="fas fa-user"></i>
        </div>
        <div class="user-name" id="user-name">Koch</div>
        <div class="user-role">Administrator</div>
      </div>
      <ul class="dropdown-menu">
        <li>
          <a href="#" class="dropdown-item">
            <i class="fas fa-cog"></i>
            Settings
          </a>
        </li>
        <li>
          <a href="/logout" class="dropdown-item logout">
            <i class="fas fa-sign-out-alt"></i>
            Logout
          </a>
        </li>
      </ul>
    </div>
  </div>
  
  <div class="container">
    <header>
      <h1><i class="fas fa-cloud-upload-alt"></i> Kloud</h1>
      <p class="subtitle">File storage for the Kochs</p>
    </header>
    
    <div class="card">
      <div class="breadcrumb-container">
        <div class="breadcrumb" id="breadcrumb">
          <button class="breadcrumb-item" data-path="">
            <i class="fas fa-home"></i> Home
          </button>
        </div>
        <div class="folder-actions">
          <button id="new-folder-btn" class="action-btn">
            <i class="fas fa-folder-plus"></i> New Folder
          </button>
        </div>
      </div>
    </div>
    
    <div class="card upload-container">
      <h2>Upload Files</h2>
      <form id="upload-form">
        <div class="file-input-container">
          <label for="file-input" class="file-input-label">
            <i class="fas fa-file-upload"></i>
            <span id="file-name">Choose a file...</span>
          </label>
          <input type="file" id="file-input" required>
        </div>
        <div class="form-group">
          <input type="text" id="display-name" placeholder="Enter file name (optional)">
        </div>
        <button type="submit" id="upload-button">
          <i class="fas fa-cloud-upload-alt"></i>
          Upload
        </button>
      </form>
      <div id="upload-progress" class="progress-bar">
        <div class="progress" id="progress-bar"></div>
      </div>
    </div>
    
    <div class="card files-container">
      <h2>Your Files</h2>
      <div class="files-list" id="files-list">
        <div class="loading-indicator">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Modals -->
  <div id="new-folder-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Create New Folder</h3>
        <button class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="new-folder-form">
          <div class="form-group">
            <label for="folder-name">Folder Name</label>
            <input type="text" id="folder-name" placeholder="Enter folder name" required>
          </div>
          <div class="form-actions">
            <button type="button" class="cancel-btn">Cancel</button>
            <button type="submit" class="create-btn">Create</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <div id="rename-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Rename</h3>
        <button class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="rename-form">
          <div class="form-group">
            <label for="new-name">New Name</label>
            <input type="text" id="new-name" placeholder="Enter new name" required>
            <input type="hidden" id="rename-path">
            <input type="hidden" id="rename-type">
          </div>
          <div class="form-actions">
            <button type="button" class="cancel-btn">Cancel</button>
            <button type="submit" class="rename-btn">Rename</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <div id="toast" class="toast"></div>
  
  <script src="script.js"></script>
  <script>
    // User menu functionality
    document.addEventListener('DOMContentLoaded', () => {
      const userMenuToggle = document.getElementById('user-menu-toggle');
      const userDropdown = document.getElementById('user-dropdown');
      
      // Check authentication status
      fetch('/api/auth-status', {
        method: 'GET',
        credentials: 'include' // Important for cookies/session
      })
        .then(response => {
          if (!response.ok) {
            throw new Error('Auth status check failed');
          }
          return response.json();
        })
        .then(data => {
          if (data.authenticated && data.user) {
            document.getElementById('user-name').textContent = data.user.username;
          } else {
            // Not authenticated, redirect to login
            window.location.replace('/login.html');
          }
        })
        .catch(error => {
          console.error('Error checking auth status:', error);
          // On error, redirect to login
          window.location.replace('/login.html');
        });
      
      // Toggle user dropdown
      userMenuToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        userDropdown.classList.toggle('show');
      });
      
      // Close dropdown when clicking outside
      document.addEventListener('click', (e) => {
        if (!userMenuToggle.contains(e.target) && !userDropdown.contains(e.target)) {
          userDropdown.classList.remove('show');
        }
      });
    });
  </script>
</body>
</html>
