<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kloud</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="theme-switch-wrapper">
    <span class="theme-icon"><i class="fas fa-moon"></i></span>
    <label class="theme-switch">
      <input type="checkbox" id="theme-toggle">
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="container">
    <header>
      <h1><i class="fas fa-cloud-upload-alt"></i> Kloud</h1>
      <p class="subtitle">File storage for the Kochs</p>
    </header>
    
    <div class="app-container">
      <nav class="app-nav">
        <div class="breadcrumb" id="breadcrumb">
          <button class="breadcrumb-item" data-path="">
            <i class="fas fa-home"></i> Home
          </button>
        </div>
        <div class="nav-actions">
          <button id="new-folder-btn" class="action-btn">
            <i class="fas fa-folder-plus"></i> New Folder
          </button>
        </div>
      </nav>
      
      <div class="app-grid">
        <!-- Upload area -->
        <div class="upload-container card">
          <div class="card-header">
            <h2><i class="fas fa-upload"></i> Upload Files</h2>
          </div>
          <form id="upload-form">
            <div class="file-input-container">
              <label for="file-input" class="file-input-label">
                <i class="fas fa-file-upload"></i>
                <span id="file-name">Choose files...</span>
              </label>
              <input type="file" id="file-input" multiple required>
            </div>
            <div class="form-group">
              <input type="text" id="display-name" placeholder="Display name (optional for single file)">
            </div>
            <button type="submit" id="upload-button">
              <i class="fas fa-cloud-upload-alt"></i>
              Upload
            </button>
          </form>
          <div id="selected-files-container" class="selected-files-container"></div>
          <div id="upload-progress" class="progress-bar">
            <div class="progress" id="progress-bar"></div>
          </div>
        </div>
        
        <!-- Files and folders area -->
        <div class="files-container card">
          <div class="card-header">
            <h2><i class="fas fa-folder-open"></i> Files & Folders</h2>
          </div>
          <div class="files-list" id="files-list">
            <div class="loading-indicator">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Modals -->
  <div id="new-folder-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Create New Folder</h3>
        <button class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="new-folder-form">
          <div class="form-group">
            <label for="folder-name">Folder Name</label>
            <input type="text" id="folder-name" placeholder="Enter folder name" required>
          </div>
          <div class="form-actions">
            <button type="button" class="cancel-btn">Cancel</button>
            <button type="submit" class="create-btn">Create</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <div id="rename-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Rename</h3>
        <button class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="rename-form">
          <div class="form-group">
            <label for="new-name">New Name</label>
            <input type="text" id="new-name" placeholder="Enter new name" required>
            <input type="hidden" id="rename-path">
            <input type="hidden" id="rename-type">
          </div>
          <div class="form-actions">
            <button type="button" class="cancel-btn">Cancel</button>
            <button type="submit" class="rename-btn">Rename</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <div id="toast" class="toast"></div>
  
  <script src="script.js"></script>
</body>
</html>
